<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      background-color: #0b0b0b;
      color: #eaeaea;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #888;
      margin-bottom: 30px;
    }

    .button {
      padding: 12px 30px;
      border: 1px solid #eaeaea;
      color: #eaeaea;
      text-decoration: none;
      transition: 0.3s;
    }

    .button:hover {
      background-color: #eaeaea;
      color: #0b0b0b;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CHRISTIAN</h1>
    <p>Minimal. Clean. Intentional.</p>
    <a href="#" class="button">Enter</a>
  </div>
</body>
</html>
