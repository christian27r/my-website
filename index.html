<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      background-color: #0b0b0b;
      color: #eaeaea;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      font-weight: 500;
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s ease forwards;
    }

    p {
      font-size: 18px;
      color: #888;
      margin-bottom: 30px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.3s;
    }

    .button {
      padding: 12px 30px;
      border: 1px solid #eaeaea;
      color: #eaeaea;
      text-decoration: none;
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.6s;
    }

    .button:hover {
      background-color: #eaeaea;
      color: #0b0b0b;
      transform: scale(1.05);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>CHRISTIAN</h1>
    <p>Minimal. Clean. Intentional.</p>
    <a href="#" class="button">Enter</a>
  </div>
</body>
</html>
